[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-continuity-layer"
version = "0.3.0.dev0"
description = "Reference implementation for the Robot Continuity Layer draft specification"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rcl = "rcl.cli:main"
rcl-conformance = "rcl.conformance_cli:main"

[tool.setuptools]
packages = ["rcl", "rcl_ros2"]
include-package-data = true

[tool.setuptools.package-data]
rcl = ["schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
